name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24', '25']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci --ignore-scripts`: nothing in this project needs an install hook, and
      # refusing to run them keeps a compromised transitive dependency from executing
      # code during CI setup.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage floor
        run: npm test

      - name: Documentation coverage
        run: npm run docs:check
